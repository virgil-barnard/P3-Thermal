[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-calibration-lab"
version = "0.1.0"
description = "Reproducible physical-target synthetic thermal calibration sequences"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]

[project.scripts]
thermal-calibration = "thermal_calibration.__main__:main"

[tool.setuptools.package-data]
thermal_calibration = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["thermal_calibration*"]

[tool.ruff]
line-length = 100
