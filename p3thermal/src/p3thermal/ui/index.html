<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 Thermal</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui; background: #11151d; color: #dce5f2; }
  body { margin: 0; } main { max-width: 1100px; margin: auto; padding: 20px; }
  h1 { letter-spacing: .08em; font-size: 18px; } .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; }
   .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .viewer { min-width: 0; } .viewer h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .06em; } .image-wrap { overflow: auto; max-height: 62vh; background: #06090e; border: 1px solid #3a4659; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
  .panel, .metrics { background: #1a2230; border: 1px solid #3a4659; padding: 12px; }
  .panel { display: grid; gap: 10px; align-content: start; min-width: 0; } label { display: grid; gap: 4px; min-width: 0; }
  input, select, button { box-sizing: border-box; min-width: 0; width: 100%; min-height: 31px; background: #101720; color: inherit; border: 1px solid #53637a; padding: 5px; }
  button { cursor: pointer; } .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
   .metrics { white-space: pre-line; overflow-wrap: anywhere; line-height: 1.55; min-height: 22px; } #status { height: 4.7em; overflow: hidden; } small { color: #aebed2; } .histogram { width: 100%; height: 80px; background: #090d13; }
   @media (max-width: 720px) { main { padding: 12px; } .layout, .comparison { grid-template-columns: 1fr; } .image-wrap { max-height: 52vh; } }
</style>
<main>
  <h1>P3 THERMAL <small>native values, display-only processing</small></h1>
  <div class="layout"><div class="comparison"><section class="viewer"><h2>ORIGINAL</h2><div class="image-wrap"><canvas id="nativeImage"></canvas></div><label>Digital zoom: original <input id="nativeZoom" type="range" min="1" max="8" value="2"><small id="nativeZoomLabel">2x</small></label><canvas class="histogram" id="nativeHistogram" width="256" height="80"></canvas></section><section class="viewer"><h2>LEARNED PREVIEW</h2><div class="image-wrap"><canvas id="learnedImage"></canvas></div><label>Digital zoom: learned <input id="learnedZoom" type="range" min="1" max="8" value="2"><small id="learnedZoomLabel">2x</small></label><canvas class="histogram" id="learnedHistogram" width="256" height="80"></canvas></section></div><aside class="panel">
    <div class="metrics" id="status">Connecting...</div><div class="metrics" id="cursor">Move over the image</div><div class="metrics" id="roi">Drag to select an ROI</div>
    <label>Palette <select id="palette"><option value="iron">Iron</option><option value="gray">White hot</option><option value="black">Black hot</option><option value="ice">Ice</option><option value="rainbow">Rainbow</option><option value="ember" selected>Ember</option></select></label>
    <label>Rotation <select id="rotation"><option value="0">0 degrees</option><option value="90">90 degrees clockwise</option><option value="180">180 degrees</option><option value="270" selected>270 degrees clockwise</option></select></label>
    <label>Display interpolation <select id="interpolation"><option value="nearest">Nearest neighbor</option><option value="low">Smoothed (low)</option><option value="high">Smoothed (high)</option></select></label>
    <label>Learned scale <select id="source"><option value="2">Learned 2x</option><option value="3">Learned 3x</option><option value="4">Learned 4x</option></select></label>
    <div class="row"><label>Range min <input id="minimum" type="number" placeholder="auto"></label><label>Range max <input id="maximum" type="number" placeholder="auto"></label></div>
    <label>Preview filter <select id="filter"><option value="none">None</option><option value="box">3x3 box average</option><option value="median">3x3 median</option></select></label>
    <div class="row"><label>Low percentile <input id="lowPercent" type="range" min="0" max="49" value="2"><small id="lowLabel">2%</small></label><label>High percentile <input id="highPercent" type="range" min="51" max="100" value="98"><small id="highLabel">98%</small></label></div>
    <button id="auto">Use percentile auto range</button>
    <small>Drag for displayed-pixel ROI statistics. Filters, palette, and learned previews never alter recordings.</small>
    <label>Session directory <input id="directory" value="sessions/live-session"></label><button id="record">Start recording</button>
  </aside></div>
</main>
<script>
 const ui=Object.fromEntries(['status','cursor','roi','palette','rotation','interpolation','source','nativeZoom','learnedZoom','nativeZoomLabel','learnedZoomLabel','minimum','maximum','filter','auto','lowPercent','highPercent','lowLabel','highLabel','directory','record'].map(id=>[id,document.getElementById(id)]));
 const panes={native:{name:'Original',image:document.querySelector('#nativeImage'),histogram:document.querySelector('#nativeHistogram'),zoom:ui.nativeZoom},learned:{name:'Learned',image:document.querySelector('#learnedImage'),histogram:document.querySelector('#learnedHistogram'),zoom:ui.learnedZoom}};Object.values(panes).forEach(pane=>{pane.context=pane.image.getContext('2d');pane.histogramContext=pane.histogram.getContext('2d');pane.width=256;pane.height=192});let previousCount=0,previousTime=performance.now();
const clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
 function selectedRange(pane){if(ui.minimum.value&&ui.maximum.value)return[+ui.minimum.value,+ui.maximum.value];return pane.autoRange||[0,1]}
 function labels(){ui.lowLabel.textContent=`${ui.lowPercent.value}%`;ui.highLabel.textContent=`${ui.highPercent.value}%`;ui.nativeZoomLabel.textContent=`${ui.nativeZoom.value}x`;ui.learnedZoomLabel.textContent=`${ui.learnedZoom.value}x`}
 function percentileRange(pane){const sorted=Array.from(pane.values).sort((a,b)=>a-b);return[sorted[Math.floor(sorted.length*ui.lowPercent.value/100)],sorted[Math.floor(sorted.length*ui.highPercent.value/100)]]}
 function filtered(pane){if(ui.filter.value==='none')return pane.values;const output=new Uint16Array(pane.values.length);for(let y=0;y<pane.height;y++)for(let x=0;x<pane.width;x++){const nearby=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)nearby.push(pane.values[clamp(y+dy,0,pane.height-1)*pane.width+clamp(x+dx,0,pane.width-1)]);output[y*pane.width+x]=ui.filter.value==='box'?nearby.reduce((a,b)=>a+b,0)/9:nearby.sort((a,b)=>a-b)[4]}return output}
function colour(t){if(ui.palette.value==='gray'){const c=255*t;return[c,c,c]}if(ui.palette.value==='black'){const c=255*(1-t);return[c,c,c]}if(ui.palette.value==='ice')return[40*t,210*t,255*(.25+.75*t)];if(ui.palette.value==='rainbow')return[255*Math.sin(Math.PI*t),255*Math.sin(Math.PI*(t+.33)),255*Math.sin(Math.PI*(t+.66))].map(value=>Math.max(0,value));if(ui.palette.value==='ember')return[255*t,110*Math.pow(t,2),25*Math.pow(t,5)];return[255*t,255*Math.pow(t,.65),255*(1-t)*(1-t)]}
 function drawHistogram(pane,low,high){const bins=new Uint32Array(64);for(const value of pane.values)bins[clamp(Math.floor(64*(value-low)/(high-low||1)),0,63)]++;pane.histogramContext.clearRect(0,0,256,80);pane.histogramContext.fillStyle='#76a9e8';const peak=Math.max(...bins,1);bins.forEach((count,index)=>pane.histogramContext.fillRect(index*4,80-80*count/peak,3,80*count/peak))}
 function draw(pane){if(!pane.values)return;const zoom=+pane.zoom.value,display=filtered(pane),[low,high]=selectedRange(pane),source=new OffscreenCanvas(pane.width,pane.height),sourceContext=source.getContext('2d'),pixels=sourceContext.createImageData(pane.width,pane.height),rotation=+ui.rotation.value,sideways=rotation===90||rotation===270;for(let index=0;index<display.length;index++){const[r,g,b]=colour(clamp((display[index]-low)/(high-low||1),0,1)),p=index*4;pixels.data[p]=r;pixels.data[p+1]=g;pixels.data[p+2]=b;pixels.data[p+3]=255}sourceContext.putImageData(pixels,0,0);if(pane.roi){sourceContext.strokeStyle='#fff';sourceContext.strokeRect(pane.roi.x+.5,pane.roi.y+.5,pane.roi.w,pane.roi.h)}pane.image.width=(sideways?pane.height:pane.width)*zoom;pane.image.height=(sideways?pane.width:pane.height)*zoom;pane.context.imageSmoothingEnabled=ui.interpolation.value!=='nearest';pane.context.imageSmoothingQuality=ui.interpolation.value==='high'?'high':'low';pane.context.save();if(rotation===90){pane.context.translate(pane.image.width,0);pane.context.rotate(Math.PI/2)}else if(rotation===180){pane.context.translate(pane.image.width,pane.image.height);pane.context.rotate(Math.PI)}else if(rotation===270){pane.context.translate(0,pane.image.height);pane.context.rotate(-Math.PI/2)}pane.context.drawImage(source,0,0,pane.width*zoom,pane.height*zoom);pane.context.restore();drawHistogram(pane,low,high)}
 function drawAll(){Object.values(panes).forEach(draw)}
 function coordinates(event,pane){const rect=pane.image.getBoundingClientRect(),zoom=+pane.zoom.value,dx=Math.floor((event.clientX-rect.left)*pane.image.width/rect.width/zoom),dy=Math.floor((event.clientY-rect.top)*pane.image.height/rect.height/zoom),rotation=+ui.rotation.value;let x=dx,y=dy;if(rotation===90)[x,y]=[dy,pane.height-1-dx];else if(rotation===180)[x,y]=[pane.width-1-dx,pane.height-1-dy];else if(rotation===270)[x,y]=[pane.width-1-dy,dx];return{x:clamp(x,0,pane.width-1),y:clamp(y,0,pane.height-1)}}
 function updateRoi(pane){if(!pane.roi||!pane.values){ui.roi.textContent='Drag to select an ROI';return}let min=Infinity,max=-Infinity,sum=0,count=0;for(let y=pane.roi.y;y<pane.roi.y+pane.roi.h;y++)for(let x=pane.roi.x;x<pane.roi.x+pane.roi.w;x++){const value=pane.values[y*pane.width+x];min=Math.min(min,value);max=Math.max(max,value);sum+=value;count++}ui.roi.textContent=`${pane.name} ROI ${pane.roi.w}x${pane.roi.h}: min ${min}, mean ${(sum/count).toFixed(1)}, max ${max}`}
 function bindPane(pane){let start;pane.image.onpointerdown=event=>{start=coordinates(event,pane);pane.image.setPointerCapture(event.pointerId)};pane.image.onpointermove=event=>{if(!pane.values)return;const point=coordinates(event,pane);if(start){pane.roi={x:Math.min(start.x,point.x),y:Math.min(start.y,point.y),w:Math.abs(point.x-start.x)+1,h:Math.abs(point.y-start.y)+1};draw(pane);updateRoi(pane)}ui.cursor.textContent=`${pane.name} cursor x ${point.x}, y ${point.y}, raw ${pane.values[point.y*pane.width+point.x]}`};pane.image.onpointerup=()=>{start=null}}
 Object.values(panes).forEach(bindPane);ui.auto.onclick=()=>{ui.minimum.value='';ui.maximum.value='';Object.values(panes).filter(pane=>pane.values).forEach(pane=>{pane.autoRange=percentileRange(pane)});drawAll()};['palette','rotation','interpolation','minimum','maximum','filter'].forEach(id=>ui[id].oninput=drawAll);['nativeZoom','learnedZoom'].forEach(id=>ui[id].oninput=()=>{labels();drawAll()});ui.source.onchange=()=>fetch('/api/preview',{method:'POST',body:JSON.stringify({scale:+ui.source.value})});['lowPercent','highPercent'].forEach(id=>ui[id].oninput=()=>{if(+ui.lowPercent.value>=+ui.highPercent.value){if(id==='lowPercent')ui.highPercent.value=+ui.lowPercent.value+1;else ui.lowPercent.value=+ui.highPercent.value-1}labels();ui.auto.onclick()});
ui.record.onclick=async()=>{const status=await fetch('/api/status').then(response=>response.json()),endpoint=status.recording?'/api/recording/stop':'/api/recording/start';await fetch(endpoint,{method:'POST',body:status.recording?undefined:JSON.stringify({directory:ui.directory.value})})};
 async function load(pane,response){if(!response.ok)return;const width=Number(response.headers.get('X-P3-Width')),height=Number(response.headers.get('X-P3-Height')),body=await response.arrayBuffer();if(Number.isInteger(width)&&Number.isInteger(height)&&width>0&&height>0&&body.byteLength===width*height*2){pane.width=width;pane.height=height;pane.values=new Uint16Array(body);if(!ui.minimum.value||!ui.maximum.value)pane.autoRange=percentileRange(pane);draw(pane)}}
 async function refresh(){try{const responses=await Promise.all([fetch('/api/frame'),fetch('/api/preview')]);await Promise.all([load(panes.native,responses[0]),load(panes.learned,responses[1])]);const status=await fetch('/api/status').then(response=>response.json()),now=performance.now(),fps=(status.frames_received-previousCount)*1000/(now-previousTime),preview=status.learned_preview;previousCount=status.frames_received;previousTime=now;ui.source.disabled=!preview.available;const learnedStatus=preview.available?` | learned ${preview.scale}x ${preview.inference_ms??'waiting'} ms`:'';ui.status.textContent=`frames ${status.frames_received} | ${fps.toFixed(1)} preview fps | ${status.quality||'waiting'} | recording ${status.recording?'on':'off'}${learnedStatus}\nTemperature interpretation: ${status.temperature_interpretation}`;ui.record.textContent=status.recording?'Stop recording':'Start recording'}catch(error){ui.status.textContent=`Connection error: ${error}`}setTimeout(refresh,100)}
 labels();ui.source.onchange();refresh();
</script>
</html>
