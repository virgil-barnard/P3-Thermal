[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3thermal"]

[project]
name = "p3thermal"
version = "0.1.0"
description = "Direct acquisition and recording tools for Thermal Master P3 cameras"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pyusb>=1.2",
    "libusb-package>=1.0; platform_system == 'Windows'",
]

[project.scripts]
p3thermal = "p3thermal.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-Werror"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/p3thermal/service.py" = ["E501"]
