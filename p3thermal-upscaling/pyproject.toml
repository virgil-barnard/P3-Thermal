[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3thermal_upscaling"]

[project]
name = "p3thermal-upscaling"
version = "0.1.0"
description = "GPU training and TorchScript export for P3 thermal upsampling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
p3thermal-upscaling-train = "p3thermal_upscaling.train:main"
p3thermal-upscaling-export = "p3thermal_upscaling.export:main"
p3thermal-upscaling-serve = "p3thermal_upscaling.serve:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-Werror"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
